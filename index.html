<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b42318">
  <title>救護接駁點</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">偏遠救護接駁</div>
    <div class="topbar-sub" id="aBadge">讀取資料中…</div>
  </header>

  <main class="page">
    <div id="alerts"></div>

    <details class="card a-section" id="aSection">
      <summary id="aSummary">出勤分隊（A）</summary>
      <div class="chips" id="aChips"></div>
    </details>

    <section class="card">
      <h2><span class="step">1</span>支援分隊（B）</h2>
      <div class="chips" id="bChips"></div>
    </section>

    <section class="card">
      <h2><span class="step">2</span>送往醫院</h2>
      <div class="chips" id="hChips"></div>
    </section>

    <section class="card">
      <h2><span class="step">3</span>案發現場位置</h2>
      <p class="geo-status" id="geoStatus">準備定位…</p>
      <div class="button-row">
        <button type="button" class="btn" id="relocateBtn">重新定位</button>
        <button type="button" class="btn" id="pickBtn">在地圖上點選</button>
      </div>
    </section>

    <section id="result" aria-live="polite"></section>

    <section class="card map-card">
      <div id="map" class="map"></div>
      <p class="hint">紅色 A 是案發現場，可以拖曳修正。綠色 1 是建議接駁點，橘色 2、3 是備案。</p>
    </section>
  </main>

  <footer class="footer">
    <p>本系統僅供決策輔助，實際接駁點以指揮中心或帶隊官指示為準。</p>
    <p id="dataSource"></p>
    <p><a href="tools.html">管理工具（產生 NFC／QR Code 網址）</a></p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
